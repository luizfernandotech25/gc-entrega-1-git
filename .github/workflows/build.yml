name: Build Java - GC Entrega 2

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v6

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Executar testes JUnit
        run: mvn -f app/pom.xml test

      - name: Gerar build
        run: mvn -f app/pom.xml package

      - name: Gerar Javadoc
        run: mvn -f app/pom.xml javadoc:javadoc

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Publicar artefato do Javadoc
        uses: actions/upload-pages-artifact@v5
        with:
          path: app/target/reports/apidocs
