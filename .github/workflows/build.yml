name: Build Java - GC Entrega 2

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v6

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Executar testes JUnit
        run: mvn -f app/pom.xml test

      - name: Gerar build
        run: mvn -f app/pom.xml package

      - name: Gerar Javadoc
        run: mvn -f app/pom.xml javadoc:javadoc

      - name: Gerar relatório HTML dos testes
        run: mvn -f app/pom.xml surefire-report:report

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Preparar site para publicação
        run: |
          mkdir -p app/target/site/apidocs app/target/site/testes
          cp -a app/target/reports/apidocs/. app/target/site/apidocs/
          cp app/target/reports/surefire.html app/target/site/testes/surefire.html
          cat > app/target/site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Entrega 2 — Gerência de Configuração</title>
          </head>
          <body>
            <h1>Gerência de Configuração — Entrega 2</h1>
            <h2>Documentação Javadoc</h2>
            <p><a href="apidocs/index.html">Consultar documentação Java</a></p>
            <h2>Relatório dos testes JUnit</h2>
            <p><a href="testes/surefire.html">Consultar relatório dos testes</a></p>
          </body>
          </html>
          EOF

      - name: Publicar artefato do site
        uses: actions/upload-pages-artifact@v5
        with:
          path: app/target/site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
